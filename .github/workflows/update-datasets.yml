name: Update datasets

# Every day at 12:00 UTC = 20:00 Philippine time (UTC+8, no daylight saving).
# GitHub can start scheduled runs a few minutes late.
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

# The job only reads the repository: the data goes straight from Open-Meteo to Supabase.
permissions:
  contents: read

# Never run two updates at the same time.
concurrency:
  group: update-datasets
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas httpx "psycopg[binary]" python-dotenv

      # Reads the last day of every location from Supabase, fetches only the missing days from Open-Meteo,
      # and writes both tables in one transaction (nothing is written if a step fails).
      # The end date is yesterday (Manila time): today is still in progress at 20:00, so only finished days are stored.
      # The last 7 days are fetched again every night and replace the stored values, because Open-Meteo revises
      # recent days. A day it returns blank is skipped and filled in by a later run.
      # A failed attempt (for example an Open-Meteo limit that clears after a pause) is retried twice.
      - name: Update Supabase from Open-Meteo
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          SUPABASE_POOLER_HOST: ${{ secrets.SUPABASE_POOLER_HOST }}
        run: |
          END_DATE="$(TZ=Asia/Manila date -d yesterday +%F)"
          for attempt in 1 2 3; do
            if python scripts/update_supabase_from_open_meteo.py --end-date "$END_DATE" --refresh-days 7; then
              exit 0
            fi
            echo "Attempt $attempt failed."
            if [ "$attempt" -lt 3 ]; then
              sleep 120
            fi
          done
          exit 1
